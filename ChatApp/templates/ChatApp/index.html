<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Room - Chat Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        @keyframes float-delayed {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-15px) rotate(-5deg);
            }
        }

        @keyframes pulse-slow {
            0%, 100% {
                transform: scale(1);
                opacity: 0.2;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.3;
            }
        }

        @keyframes pulse-slow-delayed {
            0%, 100% {
                transform: scale(1);
                opacity: 0.2;
            }
            50% {
                transform: scale(1.15);
                opacity: 0.25;
            }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .animate-float-delayed {
            animation: float-delayed 8s ease-in-out infinite;
        }

        .animate-pulse-slow {
            animation: pulse-slow 4s ease-in-out infinite;
        }

        .animate-pulse-slow-delayed {
            animation: pulse-slow-delayed 5s ease-in-out infinite 1s;
        }

        .icon-message-circle {
            display: inline-block;
            width: 1em;
            height: 1em;
        }
    </style>
</head>
<body>
    <div class="min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 flex items-center justify-center p-4 relative overflow-hidden">
        <!-- Decorative floating elements -->
        <div class="absolute top-20 left-10 opacity-20">
            <svg class="w-16 h-16 text-indigo-400 animate-float" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
            </svg>
        </div>
        <div class="absolute top-40 right-20 opacity-20">
            <svg class="w-12 h-12 text-purple-400 animate-float-delayed" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
        </div>
        <div class="absolute bottom-32 left-32 opacity-20">
            <svg class="w-10 h-10 text-pink-400 animate-float" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
            </svg>
        </div>
        <div class="absolute bottom-20 right-16 opacity-20">
            <svg class="w-14 h-14 text-indigo-300 animate-float-delayed" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
            </svg>
        </div>

        <!-- Decorative chat bubbles -->
        <div class="absolute top-1/4 left-1/4 w-20 h-20 bg-indigo-200 rounded-full opacity-20 animate-pulse-slow"></div>
        <div class="absolute bottom-1/3 right-1/4 w-16 h-16 bg-purple-200 rounded-full opacity-20 animate-pulse-slow-delayed"></div>
        <div class="absolute top-1/3 right-1/3 w-12 h-12 bg-pink-200 rounded-full opacity-20 animate-pulse-slow"></div>

        <!-- Main card -->
        <div class="relative z-10 w-full max-w-md">
            <div class="bg-white rounded-3xl shadow-xl p-8 md:p-10 backdrop-blur-sm">
                <!-- Header with icon -->
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-indigo-500 to-purple-500 rounded-2xl mb-4 transform hover:scale-110 transition-transform duration-300">
                        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                        </svg>
                    </div>
                    <h1 class="text-3xl font-bold text-indigo-900 mb-2">Enter Room</h1>
                    <p class="text-gray-500 text-sm">Join the conversation and connect with others</p>
                </div>

                <!-- Django Form -->
                <form method="POST" class="space-y-6">
                    <!-- Django CSRF Token -->
                    {% csrf_token %}
                    
                    <!-- Username field -->
                    <div class="space-y-2">
                        <label for="username" class="block text-sm font-medium text-gray-700">
                            Username
                        </label>
                        <div class="relative">
                            <input
                                type="text"
                                name="username"
                                id="username"
                                required
                                class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-indigo-400 focus:bg-white transition-all duration-300 placeholder:text-gray-400"
                                placeholder="Enter your username"
                            />
                        </div>
                    </div>

                    <!-- Room name field -->
                    <div class="space-y-2">
                        <label for="room" class="block text-sm font-medium text-gray-700">
                            Room name
                        </label>
                        <div class="relative">
                            <input
                                type="text"
                                name="room"
                                id="room"
                                required
                                class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-purple-400 focus:bg-white transition-all duration-300 placeholder:text-gray-400"
                                placeholder="Enter room name"
                            />
                        </div>
                    </div>

                    <!-- Submit button -->
                    <button
                        type="submit"
                        class="w-full bg-gradient-to-r from-indigo-500 to-purple-500 text-white py-3.5 rounded-xl font-medium hover:from-indigo-600 hover:to-purple-600 transition-all duration-300 hover:shadow-lg hover:scale-105 active:scale-95 flex items-center justify-center gap-2 group"
                    >
                        <span>Enter</span>
                        <svg class="w-4 h-4 group-hover:rotate-12 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
                        </svg>
                    </button>
                </form>

                <!-- Decorative footer -->
                <div class="mt-6 pt-6 border-t border-gray-100">
                    <p class="text-center text-sm text-gray-400 flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                        </svg>
                        Ready to chat? Let's go!
                    </p>
                </div>
            </div>

            <!-- Floating decorative elements around card -->
            <div class="absolute -top-4 -right-4 w-24 h-24 bg-purple-400 rounded-full opacity-10 animate-pulse-slow"></div>
            <div class="absolute -bottom-4 -left-4 w-32 h-32 bg-indigo-400 rounded-full opacity-10 animate-pulse-slow-delayed"></div>
        </div>
    </div>
</body>
</html>
